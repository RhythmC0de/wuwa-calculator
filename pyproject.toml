[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwa-calculator"
version = "0.1.0"
description = "Tethys Wuthering Waves calculator"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8", "pylint>=4", "black>=26"]
ocr = ["paddlepaddle>=2.6.0", "paddleocr>=2.7.3"]

[project.scripts]
tethys = "wuwa_calculator.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wuwa_calculator*"]
namespaces = true
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--import-mode=importlib"

[tool.pylint.main]
source-roots = ["src"]
extension-pkg-allow-list = ["PySide6"]
load-plugins = ["wuwa_calculator.devtools.pylint_qt"]
# Widget construction is split into these constructor-only helpers.
defining-attr-methods = [
    "__init__", "__new__", "setUp", "asyncSetUp", "__post_init__",
    "_build_ui", "_build_damage_tab", "_build_fullscreen_overlay", "_banner",
]

[tool.pylint.format]
max-line-length = 79

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.pylint.typecheck]
# The local Qt inference plugin models signal descriptors precisely.
# OpenCV exposes these reviewed symbols through its compiled module.
generated-members = [
    'cv2\.CAP_FFMPEG$',
    'cv2\.CAP_PROP_FPS$',
    'cv2\.CAP_PROP_FRAME_COUNT$',
    'cv2\.CAP_PROP_POS_MSEC$',
    'cv2\.CHAIN_APPROX_SIMPLE$',
    'cv2\.COLOR_BGR2HSV$',
    'cv2\.COLOR_BGR2RGB$',
    'cv2\.COLOR_RGB2BGR$',
    'cv2\.FONT_HERSHEY_SIMPLEX$',
    'cv2\.MORPH_CLOSE$',
    'cv2\.MORPH_OPEN$',
    'cv2\.MORPH_RECT$',
    'cv2\.RETR_EXTERNAL$',
    'cv2\.VideoCapture$',
    'cv2\.VideoWriter$',
    'cv2\.VideoWriter_fourcc$',
    'cv2\.bitwise_or$',
    'cv2\.boundingRect$',
    'cv2\.contourArea$',
    'cv2\.cvtColor$',
    'cv2\.findContours$',
    'cv2\.getStructuringElement$',
    'cv2\.inRange$',
    'cv2\.morphologyEx$',
    'cv2\.putText$',
]
